# Publica o site no GitHub Pages. Fica inativo enquanto o repositório for
# privado: no plano gratuito não há Pages, e nos pagos o site seria público.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.20
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 site/gerar_site.py
      - run: quarto render site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
